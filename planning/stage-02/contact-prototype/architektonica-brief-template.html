<style>

*{box-sizing:border-box}body{margin:0}h1,h2,h3,p{margin:0}header,footer{padding:19px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}footer{border-top:1px solid var(--line);border-bottom:0;color:var(--muted);font-size:12px}.logo{font-size:14px;font-weight:800;letter-spacing:1.7px}main{max-width:850px;margin:auto;padding:25px;min-height:65vh}h1{font-size:clamp(33px,5vw,49px);font-weight:600;line-height:1.07;letter-spacing:-1.8px}h2{font-size:27px;line-height:1.2;letter-spacing:-.7px}h3{font-size:16px}.sub{color:var(--muted);margin:10px 0 19px}.tiny{font-size:11px;color:var(--muted)}.eyebrow{font-size:11px;letter-spacing:1.5px;font-weight:700;color:#667761;text-transform:uppercase;margin:8px 0 12px}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;background:white;text-align:left;padding:11px 14px;border:1px solid var(--line);border-radius:7px}button:hover{border-color:#687c61}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid #829479;outline-offset:3px}input:not([type=checkbox]):not([type=radio]),textarea,select{width:100%;padding:12px;border:1px solid var(--line);background:white;border-radius:6px;display:block}textarea{resize:vertical;min-height:62px}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:25px 0}.step{border-top:2px solid #dcded8;padding-top:8px;color:var(--muted);font-size:12px}.step.active{border-color:var(--green);font-weight:700;color:#222}.step.done{border-color:#8b9b85}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:13px 0}.category{min-height:88px;padding:14px}.category strong{display:block;font-size:15px;margin-bottom:5px}.selected{background:#e8eee4!important;border-color:#73876a!important}.service{display:flex;align-items:flex-start;gap:10px;width:100%;padding:13px}.sign{display:inline-grid;place-items:center;flex-shrink:0;width:19px;height:19px;border:1px solid #a8b0a1;border-radius:4px;margin-top:2px;font-size:12px}.selected .sign{background:var(--green);color:white}.desc{display:block;font-size:12px;color:var(--muted);margin-top:3px}.panel{background:#fff;border:1px solid var(--line);border-radius:9px;margin:15px 0;padding:18px}.soft{background:#eaf0e6;border:1px solid #d7e0d3;border-radius:7px;padding:13px;margin:14px 0}.field{padding:17px 0;border-bottom:1px solid #eceee8}.field:last-child{border-bottom:0}.question{border:0;padding:0;margin:0;width:100%;min-width:0}.label,legend{display:block;font-weight:600;font-size:15px;margin-bottom:7px}.hint{display:block;font-size:12px;color:var(--muted);margin:3px 0 10px}.choice{display:flex;align-items:center;gap:11px;padding:12px;margin:6px 0;border:1px solid var(--line);border-radius:7px;background:#fafbf9;cursor:pointer;min-height:44px}.choice input{margin:0;width:19px;height:19px;accent-color:#50674a;flex-shrink:0}.choice span{flex:1}.choice:has(input:checked){background:#e8eee4;border-color:#73876a}.linkbtn{background:transparent;border:0;padding:5px 2px;color:#4b6045;text-decoration:underline;font-size:12px}.primary{background:#2c3d2e;color:#fff;border-color:#2c3d2e;padding:14px 20px;font-weight:600}.nav{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-top:23px}.tag{display:inline-flex;align-items:center;gap:7px;margin:4px;padding:5px 9px;background:#fff;border:1px solid #d4dcd0;border-radius:5px;font-size:12px}.tag button{border:0;background:transparent;padding:0 3px}.reviewrow{border-bottom:1px solid #eceee8;padding:9px 0;overflow-wrap:anywhere;white-space:pre-wrap}.reviewrow small{display:block;color:var(--muted);font-size:11px}.error{color:#9d3325;font-size:13px;margin:10px 0}.direct{display:flex;gap:13px;align-items:center;flex-wrap:wrap}.direct button{border:0;background:transparent;padding:4px 0;color:#50634a;font-size:12px}.contactmethods{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0}small{font-weight:400}.notice{color:var(--muted);font-size:12px}#direct-status{max-width:850px;margin:12px auto;padding:12px 20px}

<div id="arch4"></div>
<noscript>Для работы интерактивного прототипа включите JavaScript.</noscript>
<script type="application/json" id="brief-data">__EMBEDDED_BRIEF_DATA__</script>
<script>
(()=>{
'use strict';
const groups=JSON.parse(document.getElementById('brief-data').textContent);
const all=groups.flatMap(g=>g.services);
const generic={id:'other',name:'Помогите подобрать решение',desc:'Обсуждение задачи без выбора конкретной услуги',questions:[
{i:0,label:'Какую задачу или проблему необходимо решить?',opts:[],multi:false,exclusive:[]},
{i:1,label:'На каком этапе проект?',opts:['Есть идея','Есть описание','Есть действующее решение','Нужно разобраться'],multi:false,exclusive:[]},
{i:2,label:'Какого результата хотите достичь?',opts:[],multi:false,exclusive:[]},
{i:3,label:'Что уже пробовали или какие материалы имеются?',opts:[],multi:false,exclusive:[]}
]};
const app=document.getElementById('arch4'),unknown='Пока не знаю',custom='Свой вариант';
const fresh=()=>({step:0,group:-1,search:'',ids:[],other:false,index:0,answers:{},project:{business:'',company:'',timing:'',date:'',link:'',note:'',files:[]},contact:{name:'',method:'Telegram',values:{},consent:false},edit:false,sent:false,direct:'',draft:false,draftMessage:''});
let st=fresh();
const storageKey='architektonica-brief-v9-demo';
try{let d=JSON.parse(sessionStorage.getItem(storageKey)||'null');if(d&&Array.isArray(d.ids)){st.ids=d.ids.filter(id=>all.some(s=>s.id===id));st.other=!st.ids.length&&!!d.other;st.answers=d.answers||{};for(let k of ['business','company','timing','date','link','note'])st.project[k]=d.project?.[k]||'';st.draft=true;st.draftMessage='Черновик восстановлен.'}}catch(e){}
function save(){if(!st.draft)return;try{let {files,...project}=st.project;sessionStorage.setItem(storageKey,JSON.stringify({ids:st.ids,other:st.other,answers:st.answers,project}));st.draftMessage='Черновик сохраняется в этой вкладке.'}catch(e){st.draft=false;st.draftMessage='Сохранение черновика недоступно в этой среде.'}}
const esc=str=>String(str??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const byId=id=>all.find(x=>x.id===id)||generic;
const picked=()=>st.ids.length?st.ids.map(byId):st.other?[generic]:[];
const current=()=>picked()[st.index]||generic;
const answer=(s,i)=>st.answers[s.id]?.[i]||{choices:[],text:''};
function put(s,i,a){(st.answers[s.id]??={})[i]=a;save()}
function nextChoice(previous,option,multi,exclusive=[]){const special=new Set([unknown,...exclusive]);if(!multi)return [option];if(previous.includes(option))return previous.filter(x=>x!==option);if(special.has(option))return [option];return [...previous.filter(x=>!special.has(x)),option]}
const isVisible=(s,q)=>!q.condition||answer(s,q.condition.n).choices.includes(q.condition.v);
const norm=s=>s.normalize('NFKC').toLowerCase().replace(/ё/g,'е').trim();
const tokens=s=>norm(s).match(/[\p{L}\p{N}]+/gu)||[];
const stop=new Set(['мне','нам','нужен','нужна','нужно','нужны','хочу','хотим','для','как','что','какая','какую','какой','какие','какого','каких','каким','какими','каком','чем','где','кто','когда','и','в','во','на','по','с','со','у','мы','под','из','за','от','до','о','об','про','через','без','чтобы','можно','бы','пожалуйста','помогите','сделать','заказать']);
const synonyms=[['сайт','лендинг','landing','вебсайт'],['магазин','интернетмагазин'],['чатбот','бот','боты','помощник','ассистент'],['логотип','лого','знак'],['нейросеть','нейросети','нейросетей','ии','ai'],['срм','crm'],['персонал','сотрудник','кадры'],['бухгалтерия','бухгалтер','учет'],['видео','ролик','монтаж'],['квиз','квизы','квизов','тест','опрос'],['воронка','воронки','воронок']];
function wordMatch(a,b){if(a===b)return true;const n=Math.min(a.length,b.length);if(n<4||Math.abs(a.length-b.length)>4)return false;let i=0;while(i<n&&a[i]===b[i])i++;return i===n||i>=Math.max(5,n-2)}
function searchServices(q){
  const raw=tokens(q),terms=[];
  for(let i=0;i<raw.length;i++){
    if(raw[i]==='чат'){
      const next=i+(['с','со'].includes(raw[i+1])?2:1);
      if(/^бот(?:а|у|ом|е|ы|ов|ам|ами|ах)?$/.test(raw[next]||'')){terms.push('чатбот');i=next;continue}
    }
    if(!stop.has(raw[i])&&!(raw[i]==='ключ'&&raw[i-1]==='под'))terms.push(raw[i]);
  }
  const query=[...new Set(terms)];
  if(!query.length)return [];
  const minimum=Math.ceil(query.length/2);
  function related(t,w){return synonyms.some(g=>g.some(x=>wordMatch(x,t))&&g.some(x=>wordMatch(x,w)))}
  const ranked=all.map(s=>{
    const title=tokens(s.name),description=tokens(s.desc),tags=tokens(s.tags||'');let hits=0,score=0;
    for(const t of query){let weight=title.includes(t)?8:title.some(w=>wordMatch(t,w))?6:description.includes(t)?5:description.some(w=>wordMatch(t,w))?4:tags.some(w=>wordMatch(t,w))?3:[...title,...description,...tags].some(w=>related(t,w))?2:0;if(weight){hits++;score+=weight}}
    return {s,hits,score,exact:norm(s.name)===norm(q)?1:0};
  }).sort((a,b)=>b.exact-a.exact||b.hits-a.hits||b.score-a.score);
  const strict=ranked.filter(r=>r.hits>=minimum);
  return (strict.length?strict:ranked.filter(r=>r.hits>=Math.max(1,Math.floor(query.length/3)))).map(r=>r.s);
}
function serviceCount(n){const mod100=n%100,mod10=n%10;return n+' '+(mod100>=11&&mod100<=14?'услуг':mod10===1?'услуга':mod10>=2&&mod10<=4?'услуги':'услуг')}
function frame(body){let labels=['Выбор услуг','Мини-брифы','О проекте и контакты','Проверка'];app.innerHTML=`<header><span class="logo">ARCHITEKTONICA.</span><span class="tiny">ПРОТОТИП V9 / КОНТАКТЫ</span></header><main>${st.sent?'':`<nav class="steps" aria-label="Этапы заполнения">${labels.map((n,i)=>`<div class="step ${i===st.step?'active':i<st.step?'done':''}" ${i===st.step?'aria-current="step"':''}>${i+1}. ${n}</div>`).join('')}</nav>`}${body}</main><footer><span>Написать напрямую</span><span class="direct"><button data-direct="Telegram">Telegram ↗</button><button data-direct="MAX">MAX ↗</button><button data-direct="Email">Email ↗</button></span><span>Каталог — ${serviceCount(all.length)} · демонстрация без отправки данных</span></footer>${st.direct?`<div id="direct-status" class="soft" role="status">${esc(st.direct)} — официальный контакт будет подключён при реализации. Сейчас сообщения не отправляются. <button data-act="dismiss" class="linkbtn">Закрыть</button></div>`:''}`}
function service(s){let on=st.ids.includes(s.id);return `<button class="service ${on?'selected':''}" data-id="${s.id}" aria-pressed="${on}"><span class="sign">${on?'✓':''}</span><span><b>${esc(s.name)}</b><span class="desc">${esc(s.desc)}</span></span></button>`}
function results(){let list=st.search.trim()?searchServices(st.search):st.group>=0?groups[st.group].services:[];if(!st.search.trim()&&st.group<0)return '';return `<div class="tiny">${serviceCount(list.length)}</div>${list.length?`<div class="grid">${list.map(service).join('')}</div>`:'<div class="notice">Ничего не найдено. Попробуйте другое слово или опишите свою задачу.</div>'}`}
function selectPage(){frame(`<div class="eyebrow">Ваш проект</div><h1>Обсудить проект</h1><p class="sub">Расскажите, что хотите сделать. Мы изучим задачу и подготовимся к разговору.</p><div class="direct"><b>Удобнее написать?</b><button data-direct="Telegram">Telegram ↗</button><button data-direct="MAX">MAX ↗</button><button data-direct="Email">Электронная почта ↗</button></div>
<div class="field"><label class="label" for="search">Какая задача вас интересует?</label><span class="hint">Выберите одну или несколько услуг.</span><input id="search" maxlength="200" placeholder="Например: сайт, логотип, реклама, чат-бот" value="${esc(st.search)}"></div>
<div id="categories" ${st.search?'hidden':''}><div class="grid">${groups.map(g=>`<button class="category ${st.group===g.index?'selected':''}" data-group="${g.index}" aria-pressed="${st.group===g.index}"><strong>${esc(g.title)}</strong><span class="desc">${esc(g.desc)}</span><span class="tiny">${serviceCount(g.services.length)} →</span></button>`).join('')}</div></div><div id="results">${results()}</div>
<div class="panel"><button class="service ${st.other?'selected':''}" aria-pressed="${st.other}" data-act="other"><span class="sign">${st.other?'✓':'?'}</span><span><b>Не знаю, какую услугу выбрать</b><span class="desc">Опишите задачу своими словами. Мы поможем разобраться.</span></span></button></div>
${st.ids.length?`<div class="soft"><b>Выбрано услуг: ${st.ids.length}</b><div>${st.ids.map(id=>`<span class="tag">${esc(byId(id).name)}<button data-remove="${id}" aria-label="Убрать ${esc(byId(id).name)}">×</button></span>`).join('')}</div></div>`:''}
<div class="nav"><button class="linkbtn" data-act="draft">${st.draft?'Отключить сохранение черновика':'Сохранить черновик в этой вкладке'}</button><button class="primary" data-act="start" ${picked().length?'':'disabled'}>Заполнить мини-бриф${picked().length>1?'ы':''} →</button></div><p class="hint" role="status">${esc(st.draftMessage||'Каталог: '+serviceCount(all.length)+'. Можно выбрать несколько.')}</p>`)}
function questionHTML(s,q,n){const a=answer(s,q.i);if(!q.opts.length){const marked=a.choices.includes(unknown);return `<div class="field"><label for="txt-${q.i}" class="label">${n}. ${esc(q.label)}</label><textarea id="txt-${q.i}" data-text="${q.i}" maxlength="3000" placeholder="Ответьте своими словами" rows="2">${esc(a.text)}</textarea><button class="linkbtn ${marked?'selected':''}" data-unknown="${q.i}" aria-pressed="${marked}">Пока не знаю</button><span id="unknown-hint-${q.i}" class="hint" ${marked&&a.text.trim()?'':'hidden'}>Ваш текст сохранён. Снимите отметку, чтобы включить его в обращение.</span></div>`}
return `<div class="field"><fieldset class="question"><legend>${n}. ${esc(q.label)}</legend><span class="hint">${q.multi?'Можно выбрать несколько вариантов':'Выберите один вариант'}</span>${[...q.opts,custom,unknown].map((o,j)=>`<label class="choice"><input id="q-${q.i}-${j}" type="${q.multi?'checkbox':'radio'}" name="question-${q.i}" data-q="${q.i}" data-option="${esc(o)}" ${a.choices.includes(o)?'checked':''}><span>${esc(o)}</span></label>`).join('')}${a.choices.includes(custom)?`<label class="hint" for="txt-${q.i}">Уточните свой вариант</label><textarea id="txt-${q.i}" rows="2" maxlength="3000" data-text="${q.i}" placeholder="Напишите своими словами">${esc(a.text)}</textarea>`:''}</fieldset></div>`}
function briefPage(){let s=current();frame(`<div class="eyebrow">Бриф ${st.index+1} из ${picked().length}</div><h2>${esc(s.name)}</h2><p class="sub">${esc(s.desc)}. Ответьте на вопросы, которые помогут нам подготовиться к консультации.</p>${picked().length>1?`<div>${picked().map((x,i)=>`<button data-jump="${i}" class="${st.index===i?'selected':''}" style="font-size:11px;margin:3px">${i+1}. ${esc(x.name)}</button>`).join('')}</div>`:''}<div class="panel">${s.questions.filter(q=>isVisible(s,q)).map((q,i)=>questionHTML(s,q,i+1)).join('')}</div><p class="hint">Отвечайте только на те вопросы, ответы на которые знаете. Не отправляйте пароли, секретные ключи или конфиденциальные документы.</p><div class="nav"><button data-act="prevbrief">← Назад</button><button class="primary" data-act="nextbrief">${st.edit?'Вернуться к проверке':st.index<picked().length-1?'Следующий бриф':'О проекте и контакты'} →</button></div>`)}
function projectPage(){let p=st.project,c=st.contact,v=c.values[c.method]||'';let placeholders={Telegram:'@username или номер телефона',MAX:'Номер телефона или @имя пользователя',Email:'name@example.com',Телефон:'+7 900 000 00 00'};frame(`<div class="eyebrow">О проекте и контакты</div><h2>Давайте познакомимся</h2><p class="sub">Эту информацию заполняем один раз, независимо от количества услуг.</p><p class="hint">Перед заполнением ознакомьтесь с <a href="#privacy-policy" data-legal="privacy-policy">политикой обработки персональных данных</a>.</p><div class="panel"><h3>О вашем проекте</h3><div class="field"><label for="business" class="label">Чем занимается ваша компания или проект?</label><textarea id="business" data-project="business" maxlength="3000" placeholder="Расскажите немного о вашей деятельности" rows="2">${esc(p.business)}</textarea></div><div class="field"><label for="company" class="label">Название компании <small class="tiny">Необязательно</small></label><input id="company" data-project="company" maxlength="200" value="${esc(p.company)}"></div>
<div class="field"><label class="label" for="timing">Когда нужен результат? <small class="tiny">Необязательно</small></label><select id="timing" data-project="timing">${['','Как можно скорее','В течение месяца','1–3 месяца','Более 3 месяцев','Есть конкретная дата','Пока не определено'].map(x=>`<option value="${esc(x)}" ${x===p.timing?'selected':''}>${esc(x||'Выберите вариант')}</option>`).join('')}</select>${p.timing==='Есть конкретная дата'?`<label for="date" class="hint">Укажите желаемую дату</label><input id="date" data-project="date" maxlength="100" value="${esc(p.date)}" placeholder="Например, 15 декабря">`:''}</div>
<div class="field"><label for="link" class="label">Ссылки на сайты или материалы <small class="tiny">Необязательно</small></label><textarea id="link" data-project="link" maxlength="3000" rows="2" placeholder="Укажите ссылки и, если их несколько, к какой услуге они относятся">${esc(p.link)}</textarea></div><div class="field"><label for="files" class="label">Прикрепить имеющийся бриф, ТЗ или материалы <small class="tiny">Необязательно</small></label><input id="files" type="file" multiple accept=".pdf,.doc,.docx,.jpg,.jpeg,.png,.heic,.heif,.webp,.txt,.xls,.xlsx,.csv,.ppt,.pptx,.pages,.key,.numbers,.rtf,.zip,.7z"><p class="hint">Файлы в демонстрации не передаются.</p>${p.files.map((f,i)=>`<span class="tag">${esc(f)} <button data-remove-file="${i}" aria-label="Убрать файл">×</button></span>`).join('')}</div><div class="field"><label for="note" class="label">Что ещё важно знать? <small class="tiny">Необязательно</small></label><textarea rows="3" id="note" data-project="note" maxlength="3000" placeholder="Пожелания и дополнительные сведения">${esc(p.note)}</textarea></div></div>
<div class="panel"><h3>Контактные данные</h3><div class="field"><label class="label" for="fullname">Имя и фамилия *</label><input id="fullname" autocomplete="name" data-contact="name" maxlength="150" value="${esc(c.name)}"></div><div class="field"><div class="label">Как удобнее связаться? *</div><div class="contactmethods">${['Telegram','MAX','Email','Телефон'].map(x=>`<button class="${c.method===x?'selected':''}" data-method="${x}" aria-pressed="${c.method===x}">${x}</button>`).join('')}</div><label for="contactvalue" class="hint">Контакт для связи</label><input id="contactvalue" data-contact="value" maxlength="254" type="${c.method==='Email'?'email':c.method==='Телефон'?'tel':'text'}" value="${esc(v)}" placeholder="${placeholders[c.method]}"></div></div>${legalDocuments()}<div id="err" class="error" role="alert"></div><div class="nav"><button data-act="backproject">← Назад</button><button class="primary" data-act="review">Проверить обращение →</button></div>`)}
function answerText(s,q){let a=answer(s,q.i);if(!q.opts.length&&a.choices.includes(unknown))return unknown;return [...a.choices.filter(x=>x!==custom),(!q.opts.length||a.choices.includes(custom))?a.text:''].filter(Boolean).join('; ')}
function meaningful(s,q){let a=answer(s,q.i);if(!q.opts.length&&a.choices.includes(unknown))return false;return a.choices.some(x=>x!==unknown&&x!==custom)||((!q.opts.length||a.choices.includes(custom))&&a.text.trim()&&a.text.trim()!==unknown)}
function row(a,b){return `<div class="reviewrow"><small>${esc(a)}</small>${esc(b||'Не указано')}</div>`}
function legalDocuments(){return `<div class="panel"><p class="hint"><b>Документы для согласования перед публикацией.</b> В прототипе данные не передаются. Реквизиты оператора и условия обработки необходимо утвердить до запуска.</p><details id="consent-document"><summary>Согласие на обработку персональных данных (проект)</summary><p>Я добровольно даю согласие оператору [полное наименование, адрес] на обработку имени, фамилии, указанного контакта, сведений об обращении и материалов, содержащих мои персональные данные, в целях рассмотрения моего обращения и связи со мной по выбранному каналу. Согласие не распространяется на рекламные рассылки.</p><p>Перечень действий с данными, способы обработки, срок действия согласия и порядок его отзыва подлежат утверждению оператором до публикации. Канал отзыва: [контакт оператора].</p></details><details id="privacy-policy"><summary>Политика обработки персональных данных (проект)</summary><p>Оператор: [полное наименование, адрес и контакт]. Цель обработки обращений — изучить задачу, подобрать специалиста и связаться с заявителем. Категории данных: имя и фамилия, выбранный контакт, сведения о проекте и приложенные материалы, если в них есть персональные данные.</p><p>До запуска необходимо указать правовые основания, сроки хранения, порядок удаления и отзыва согласия, права заявителей, получателей данных, сведения о безопасности, месте хранения и возможной трансграничной передаче. Полная политика должна быть опубликована отдельно и доступна без регистрации.</p></details></div>`}
function reviewPage(){let p=st.project,c=st.contact;frame(`<div class="eyebrow">Последний шаг</div><h2>Проверьте обращение</h2><p class="sub">Все выбранные услуги и ответы будут собраны в одном обращении. Любой ответ можно изменить.</p>${picked().map((s,i)=>`<div class="panel"><h3>${esc(s.name)}</h3>${s.questions.filter(q=>isVisible(s,q)).map(q=>row(q.label,answerText(s,q))).join('')}<button class="linkbtn" data-edit="${i}">Изменить бриф</button></div>`).join('')}<div class="panel"><h3>О проекте</h3>${[['Компания',p.company],['О деятельности',p.business],['Желаемый срок',p.timing],['Дата',p.timing==='Есть конкретная дата'?p.date:''],['Ссылки',p.link],['Материалы',p.files.join(', ')],['Комментарий',p.note]].filter(x=>x[1]).map(x=>row(...x)).join('')}<h3 style="margin-top:15px">Контакты</h3>${row('Имя и фамилия',c.name)}${row(c.method,c.values[c.method])}<button class="linkbtn" data-act="editproject">Изменить информацию</button></div><div class="soft"><label style="display:flex;align-items:flex-start;gap:10px"><input type="checkbox" id="consent" ${c.consent?'checked':''}> <span>Я даю согласие на обработку моих персональных данных для рассмотрения обращения и связи со мной по выбранному каналу.</span></label><p class="hint"><a href="#consent-document" data-legal="consent-document">Текст согласия на обработку персональных данных</a> · <a href="#privacy-policy" data-legal="privacy-policy">Политика обработки персональных данных</a></p></div>${legalDocuments()}<div class="nav"><button data-act="editproject">← Назад</button><button class="primary" data-act="send" id="send" ${c.consent?'':'disabled'}>Отправить обращение →</button></div><p class="hint">Это прототип. Реальная заявка не отправляется.</p>`)}
function success(){frame(`<div class="panel" style="padding:28px"><div style="font-size:34px;color:#526b4a">✓</div><h1>Спасибо за обращение.</h1><p class="sub">Мы изучим вашу задачу, подберём специалиста и свяжемся удобным для вас способом.</p><div class="soft">Демонстрация завершена. Данные не отправлены.</div><button class="primary" data-act="reset">Вернуться к странице</button></div>`)}
function render(scroll=false){if(st.sent)success();else if(st.step===0)selectPage();else if(st.step===1)briefPage();else if(st.step===2)projectPage();else reviewPage();if(scroll){let h=app.querySelector('h1,h2');if(h){h.tabIndex=-1;h.focus({preventScroll:true});h.scrollIntoView({block:'start'})}}}
function err(msg,id){let el=app.querySelector('#err');if(el)el.textContent=msg;app.querySelector('#'+id)?.focus()}
function validPhone(v){return /^\+?[\d\s().-]+$/.test(v)&&v.replace(/\D/g,'').length>=7&&v.replace(/\D/g,'').length<=15}
function checkContact(){let c=st.contact,v=(c.values[c.method]||'').trim();if(!c.name.trim())return ['Укажите имя и фамилию.','fullname'];if(!v)return ['Укажите контакт для связи.','contactvalue'];if(c.method==='Email'&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v))return ['Проверьте адрес электронной почты.','contactvalue'];if(c.method==='Телефон'&&!validPhone(v))return ['Укажите номер телефона с кодом страны.','contactvalue'];if((c.method==='Telegram'||c.method==='MAX')&&!validPhone(v)&&!(c.method==='Telegram'?/^@[A-Za-z0-9_]{3,32}$/.test(v):/^@[\p{L}\p{N}_]{3,32}$/u.test(v))&&!(c.method==='Telegram'&&/^https:\/\/t\.me\/[a-zA-Z0-9_]{3,32}\/?$/.test(v)))return ['Укажите номер телефона с кодом страны или имя пользователя с @ для '+c.method+'.','contactvalue'];return null}
function projectIssue(){return checkContact()||(!picked().some(s=>s.questions.some(q=>isVisible(s,q)&&meaningful(s,q)))&&!st.project.business.trim()&&!st.project.note.trim()?['Ответьте хотя бы на один вопрос мини-брифа (кнопка «Назад») или коротко опишите проект в поле «Чем занимается ваша компания или проект?». Можно указать, что нужна предварительная консультация.','business']:null)}
app.addEventListener('input',e=>{let t=e.target;if(t.id==='search'){st.search=t.value;app.querySelector('#categories').hidden=!!st.search;app.querySelector('#results').innerHTML=results()}if(t.dataset.text!==undefined){let s=current(),i=+t.dataset.text;let a=answer(s,i);if(!s.questions[i].opts.length&&a.choices.includes(unknown)){a={...a,choices:[]};let b=app.querySelector('[data-unknown="'+i+'"]');b?.setAttribute('aria-pressed','false');b?.classList.remove('selected');let h=app.querySelector('#unknown-hint-'+i);if(h)h.hidden=true}put(s,i,{...a,text:t.value})}if(t.dataset.project&&t.id!=='files'){st.project[t.dataset.project]=t.value;save()}if(t.dataset.contact==='name'&&st.contact.name!==t.value){st.contact.consent=false;st.contact.name=t.value}if(t.dataset.contact==='value'&&(st.contact.values[st.contact.method]||'')!==t.value){st.contact.consent=false;st.contact.values[st.contact.method]=t.value}});
app.addEventListener('change',e=>{let t=e.target;if(t.dataset.q!==undefined){let s=current(),i=+t.dataset.q,q=s.questions[i],a=answer(s,i);let choices=nextChoice(a.choices,t.dataset.option,q.multi,q.exclusive);put(s,i,{choices,text:a.text});let id=t.id;render();app.querySelector('#'+id)?.focus({preventScroll:true});return}if(t.id==='consent'){st.contact.consent=t.checked;app.querySelector('#send').disabled=!t.checked}if(t.id==='timing'){st.project.timing=t.value;save();render()}if(t.id==='files'){st.project.files=[...st.project.files,...[...t.files].map(f=>f.name)];render()}});
app.addEventListener('click',e=>{let legal=e.target.closest('a[data-legal]');if(legal?.dataset.legal){e.preventDefault();let details=document.getElementById(legal.dataset.legal);if(details){details.open=true;details.scrollIntoView({block:'nearest'})}return}let b=e.target.closest('button');if(!b||b.disabled)return;let d=b.dataset;if(d.direct){st.direct=d.direct;render();document.getElementById('direct-status')?.scrollIntoView({block:'nearest'});return}if(d.group!==undefined){st.group=st.group===+d.group?-1:+d.group;render();return}if(d.id||d.remove){let id=d.id||d.remove;st.ids=st.ids.includes(id)?st.ids.filter(x=>x!==id):[...st.ids,id];st.other=false;save();render();return}if(d.unknown!==undefined){let s=current(),i=+d.unknown,a=answer(s,i);put(s,i,{...a,choices:a.choices.includes(unknown)?[]:[unknown]});render();app.querySelector('[data-unknown="'+i+'"]')?.focus({preventScroll:true});return}if(d.jump!==undefined){st.index=+d.jump;render(true);return}if(d.method){if(st.contact.method!==d.method)st.contact.consent=false;st.contact.method=d.method;render();app.querySelector('#contactvalue')?.focus();return}if(d.removeFile!==undefined){st.project.files.splice(+d.removeFile,1);render();return}if(d.edit!==undefined){st.index=+d.edit;st.edit=true;st.step=1;render(true);return}
switch(d.act){case'dismiss':st.direct='';render();break;case'other':st.other=!st.other;if(st.other)st.ids=[];save();render();break;case'draft':st.draft=!st.draft;if(st.draft)save();else{try{sessionStorage.removeItem(storageKey)}catch(e){}st.draftMessage='Сохранение отключено. Контакты и файлы в черновике не сохранялись.'}render();break;case'start':st.index=0;st.step=1;st.edit=false;render(true);break;case'prevbrief':if(st.edit){st.edit=false;st.step=3}else if(st.index>0)st.index--;else st.step=0;render(true);break;case'nextbrief':if(st.edit){st.edit=false;st.step=3}else if(st.index<picked().length-1)st.index++;else st.step=2;render(true);break;case'backproject':st.index=Math.max(0,picked().length-1);st.step=1;st.edit=false;render(true);break;case'editproject':st.step=2;render(true);break;case'review':{let issue=projectIssue();if(issue){err(...issue);break}st.step=3;render(true);break}case'send':if(st.contact.consent){let issue=projectIssue();if(issue){st.step=2;render(true);err(...issue);break}st.sent=true;try{sessionStorage.removeItem(storageKey)}catch(e){}render(true)}break;case'reset':try{sessionStorage.removeItem(storageKey)}catch(e){}st=fresh();render(true);break}});
render();
})();
</script>
</body>
</html>
