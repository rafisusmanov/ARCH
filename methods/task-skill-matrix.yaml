# ARCHITEKTONICA: machine-readable task → skill routing (2026-11-12)
# Owner-approved plan v2 is immutable; current owner decisions and AGENTS take precedence.
schema_version: 1
stage_ids:
  - "01"
  - "02"
  - "03"
  - "04"
  - "05"
  - "06"
  - "07"
stages:
  "01":
    label: "Информационная архитектура"
  "02":
    label: "Содержание"
  "03":
    label: "Дизайн и блоки"
  "04":
    label: "Пространственная глубина и motion"
  "05":
    label: "PHP и интеграции"
  "06":
    label: "Комплексная проверка"
  "07":
    label: "Запуск"
policy:
  unlisted_task: "BLOCK_AND_ROUTE_FOR_REVIEW"
  source_missing: "BLOCK"
  explicit_only: "USER_REQUEST_ONLY"
  evidence_without_tool_trace: "NOT_VERIFIED"
  owner_approval: "REQUIRED_AT_STAGE_GATE"
  compatibility:
    live_catalogue: "6/17/87"
    legacy_ids: "81 (compatibility only)"
    removed_copy_studio: "main author role, not a skill"
    cancelled_process_route: "/process is not a live route"
tasks:
