      - "architektonica-reader-insight"
      - "architektonica-narrative-design"
      - "architektonica-search-visibility"
      - "architektonica-ui-ux-expert"
    conditional_skills:
      - when: "new_concept"
        skill: "architektonica-idea-lab"
    explicit_only_skills: []
    required_sources:
      - "AGENTS.md"
      - "methods/agent-expert-stage-protocol.md"
      - "planning/stage-01/IA_PROPOSAL.md"
      - "planning/stage-02/public-service-catalogue.json"
    deliverable: "Согласуемая IA с навигацией и связями"
    acceptance_checks:
      - "all_required_routes"
      - "ru_en_status"
