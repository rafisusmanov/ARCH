name: Creative Engine skill integrity

on:
  pull_request:
  push:
    branches: [main, 'audit/**']

permissions:
  contents: read

jobs:
  verify-skills:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install validation dependencies
        run: python3 -m pip install -r requirements-dev.txt
      - name: Verify all skills, mirrors, references, data and approved roadmap
        run: python3 -B scripts/verify_package.py
      - name: Validate task-to-skill routing and stage coverage
        run: python3 -B scripts/task_skill_router.py validate
      - name: Run regression and UI/UX tool integration tests
        run: python3 -B -m unittest discover -s tests -v
